name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: asobiba
          POSTGRES_PASSWORD: asobiba
          POSTGRES_DB: asobiba_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Set up environment variables
        run: |
          echo 'DATABASE_URL="postgresql://asobiba:asobiba@localhost:5432/asobiba_test?schema=public"' > packages/common/.env

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Run migrations
        run: pnpm --filter @asobiba/common exec prisma migrate deploy

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Run lint
        run: pnpm lint
        continue-on-error: true
